<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#07261B">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nankana Cricket Play-On and Chai Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F6EF;--card:#fff;--ink:#10281D;--mute:#58705F;--line:#D3DFD4;--turf:#1B7A4B;--onturf:#fff;--lamp:#F6C928;--err:#B3261E;--glass:rgba(255,255,255,.8);--pz:#14633C;box-sizing:border-box;padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081C15;--card:#0F2A20;--ink:#EAF3EC;--mute:#9DB8A6;--line:#1E4333;--turf:#34B27A;--onturf:#04170F;--err:#FF8A80;--glass:rgba(15,42,32,.8);--pz:#9BE8C0}}
:root[data-theme="dark"]{--bg:#081C15;--card:#0F2A20;--ink:#EAF3EC;--mute:#9DB8A6;--line:#1E4333;--turf:#34B27A;--onturf:#04170F;--err:#FF8A80;--glass:rgba(15,42,32,.8);--pz:#9BE8C0}
html{background:var(--bg);scroll-padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font:500 15px/1.45 Manrope,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-bottom:190px}
h1,h2,h3,.cd{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:700;margin:0}
h2{font-size:32px;padding:20px 16px 8px}
.hero{position:relative;overflow:hidden;padding:22px 16px 74px;border-radius:0 0 34px 34px;color:#fff;background:radial-gradient(60% 55% at 80% 22%,rgba(255,228,150,.55),transparent 62%),linear-gradient(180deg,#3A9A74 0%,#1F7553 55%,#0F4A34 100%)}
.brand{margin:0 0 16px;font:700 24px/1.05 'Barlow Condensed',sans-serif;color:var(--lamp);display:flex;align-items:center;gap:14px}.brand img{width:88px;height:88px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--lamp)}

h1{font-size:50px;line-height:.92;max-width:10ch;margin-bottom:20px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.14)}
.seg button{padding:9px 16px;border-radius:999px;font-weight:700;color:#fff}
.seg .on{background:var(--lamp);color:#1A1500}
.days{display:flex;gap:8px;overflow-x:auto;padding:16px}
.days button{flex:0 0 58px;padding:10px 0;border-radius:16px;border:1.5px solid var(--line);background:var(--glass);display:grid;gap:2px;justify-items:center}
.days span{font:700 24px 'Barlow Condensed',sans-serif}
.days b{font-size:12px;color:var(--mute)}
.days .on{background:var(--turf);border-color:var(--turf);color:var(--onturf)}
.days .on b{color:inherit}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.slot{padding:12px 6px;border-radius:16px;border:1.5px solid var(--line);background:var(--glass);text-align:center;display:grid;gap:3px}
.slot b{font:700 26px/1 'Barlow Condensed',sans-serif}
.slot span{font-size:12px;color:var(--mute)}
.slot:disabled{cursor:default;opacity:.5;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.slot.sel{background:var(--lamp);border-color:var(--lamp);color:#1A1500;box-shadow:0 6px 18px rgba(246,201,40,.4)}
.slot.sel span{color:#3b3000}
.card{margin:16px;padding:16px;border-radius:20px;background:var(--glass);border:1.5px solid var(--line)}
.card h3{font-size:24px;margin-bottom:10px}
.amen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-weight:700;font-size:13px}
.amen i{display:block;font-size:28px;font-style:normal}
.bar,nav{position:fixed;left:50%;transform:translateX(-50%)}
nav{bottom:0;z-index:10;width:min(100%,520px);display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
nav button{flex:1;padding:10px 0 12px;font-size:12px;font-weight:700;color:var(--mute);display:grid;gap:2px;justify-items:center}
nav i{font-style:normal;font-size:20px}
nav .on{color:var(--turf)}
.bar{z-index:9;bottom:calc(68px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));width:min(calc(100% - 24px),496px);display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;border-radius:22px;background:#07261B;color:#fff;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.score{display:grid;justify-items:center;line-height:1}
.score b{font:700 42px 'Barlow Condensed',sans-serif;color:var(--lamp)}
.score span{font-size:11px}
.tot{flex:1;font:700 26px 'Barlow Condensed',sans-serif}
.go{padding:13px 20px;border-radius:14px;background:var(--lamp);color:#1A1500;font-weight:800}
.sh .go,.empty .go,.card>.go{width:100%;margin-top:8px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55)}
.sh{position:fixed;z-index:21;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);max-height:90vh;overflow:auto;padding:20px 20px calc(20px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));border-radius:26px 26px 0 0;background:var(--card);animation:up .25s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.sh h2{padding:0 0 8px}
label{display:block;margin-top:12px;font-weight:700;font-size:13px}
input[type=text],input[type=tel],input[type=password]{width:100%;margin-top:6px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
.chk{display:flex;gap:10px;align-items:center}
.chk input{width:20px;height:20px;accent-color:var(--turf)}
.mute{color:var(--mute)}
.err{color:var(--err);min-height:1.4em;font-weight:700;margin:8px 0 0}
.ghost{width:100%;padding:12px;font-weight:700;color:var(--mute)}
.tk{display:grid;gap:4px}
.cd{font-size:36px;color:var(--turf);letter-spacing:.05em}
.sh .tk{padding:14px 0;margin:8px 0;border-block:2px dashed var(--line)}
.tk button{justify-self:start;margin-top:6px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);font-weight:700}
.tk a{color:var(--turf)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.stats div{padding:12px;border-radius:16px;background:var(--glass);border:1.5px solid var(--line);display:grid}
.stats b{font:700 30px 'Barlow Condensed',sans-serif}
.stats span{font-size:12px;color:var(--mute)}
.note{padding:12px 16px 0;margin:0}

@keyframes xo{to{opacity:0;visibility:hidden}}
.st,.st *{animation-duration:4.2s;animation-fill-mode:both;animation-play-state:paused}
.st{position:absolute;left:50%;top:46%;width:90vmin;height:90vmin;translate:-50% -50%;animation-name:shk;animation-timing-function:linear}

.st>div,.st>p{position:absolute}

@keyframes gl{0%{opacity:0;scale:.6}30%{opacity:.8}34%{opacity:1;scale:1.1}100%{opacity:.45;scale:1}}
.gr{left:8%;top:93%;width:84%;height:7%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);animation-name:gr}
@keyframes gr{0%{opacity:0}12%,70%{opacity:1}80%,100%{opacity:0}}
.bd{left:9%;top:6%;width:68%;aspect-ratio:357/490;transform-origin:42% 95%;animation-name:bd;animation-timing-function:ease-in-out}

.bl{left:86.16%;top:25.81%;width:9%;aspect-ratio:1;margin:-4.5% 0 0 -4.5%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a9a,#D7263D 50%,#7c0c1b);box-shadow:inset -3px -4px 8px rgba(0,0,0,.35),0 0 3vmin rgba(215,38,61,.6);animation-name:bl;animation-timing-function:linear}

.fl,.rg{left:86.16%;top:25.81%;translate:-50% -50%;border-radius:50%;aspect-ratio:1}
.fl{width:60%;background:radial-gradient(closest-side,#fff,rgba(246,201,40,.7) 35%,transparent);animation-name:fl;animation-timing-function:ease-out}
@keyframes fl{0%,33%{opacity:0;scale:.1}34.5%{opacity:1;scale:.7}46%,100%{opacity:0;scale:1.6}}
.rg{width:34%;border:.8vmin solid #F6C928;animation-name:rg;animation-timing-function:ease-out}

.st s{position:absolute;left:86.16%;top:25.81%;width:1.6vmin;height:1.6vmin;margin:-.8vmin;border-radius:50%;background:#F6C928;box-shadow:0 0 1.5vmin #F6C928;animation-name:sk;animation-timing-function:ease-out}
@keyframes sk{0%,33%{opacity:0;translate:0 0}34%{opacity:1}56%,100%{opacity:0;translate:var(--x) var(--y);scale:.2}}
.lg{left:50%;top:46%;width:58%;translate:-50% -50%;opacity:0;animation-name:lg;animation-timing-function:cubic-bezier(.2,1.1,.3,1)}
.lg img{display:block;width:100%;border-radius:50%;box-shadow:0 0 0 .9vmin #F6C928,0 0 14vmin rgba(246,201,40,.5)}
@keyframes lg{0%,58%{opacity:0;scale:.5;rotate:-12deg}72%{opacity:1;scale:1.05;rotate:0deg}78%,100%{opacity:1;scale:1;rotate:0deg}}
.nm{left:0;right:0;top:82%;margin:0;text-align:center;color:#fff;font:700 6.4vmin/1.1 'Barlow Condensed',sans-serif;letter-spacing:.04em;opacity:0;animation-name:nm}
@keyframes nm{0%,70%{opacity:0;translate:0 3vmin}80%,100%{opacity:1;translate:0 0}}
.tp{display:none;position:absolute;left:50%;bottom:10vh;translate:-50% 0;padding:15px 30px;border-radius:999px;background:var(--lamp);color:#1A1500;font-weight:800;font-size:17px;box-shadow:0 0 0 6px rgba(246,201,40,.25);animation:br 2s ease-in-out infinite}
#sp.gate .tp{display:block}
#sp.gate .lg,#sp.gate .nm{animation:none;opacity:1}
.sun{position:absolute;right:22%;top:26%;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#FFF3C4 25%,#F6C928 55%,rgba(246,201,40,0) 72%);animation:br 7s ease-in-out infinite}
@keyframes br{50%{scale:1.12;opacity:.85}}
.cl{position:absolute;left:0;height:22px;border-radius:99px;background:rgba(255,255,255,.2);filter:blur(1px);animation:dr 46s linear infinite}
@keyframes dr{from{translate:-40vw 0}to{translate:120vw 0}}
.hl{position:absolute;left:-5%;bottom:-1px;width:110%;height:70px;animation:sw 12s ease-in-out infinite alternate}
@keyframes sw{to{translate:3% 0}}
.hero p,.hero h1,.hero .seg{position:relative;z-index:1}
.sub{margin:-8px 0 18px;font-weight:600;opacity:.9}
.amb{position:absolute;top:14px;right:14px;z-index:2;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);font-size:20px}
.sec{display:flex;align-items:center;gap:8px;margin:0;padding:20px 18px 10px;font:700 26px 'Barlow Condensed',sans-serif}
.slot{border-radius:18px;box-shadow:0 3px 12px rgba(16,40,29,.07)}
.slot.sel{animation:gw 2.6s ease-in-out infinite}
@keyframes gw{50%{box-shadow:0 8px 28px rgba(246,201,40,.7)}}
.p{animation:fl2 14s ease-in-out infinite alternate}
@keyframes fl2{to{translate:0 -16px}}
.pf{position:fixed;inset:0;z-index:40;pointer-events:none}
.pf s{position:absolute;border-radius:2px;will-change:transform}

.sec small{margin-left:auto;padding:4px 12px;border-radius:99px;background:var(--glass);border:1.5px solid var(--line);font:700 13px Manrope,system-ui,sans-serif;color:var(--mute)}

.svs{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.sv{position:relative;display:grid;gap:4px;justify-items:start;text-align:left;padding:16px;border-radius:22px;background:var(--glass);border:1.5px solid var(--line);backdrop-filter:blur(3px);min-height:136px}
.sv i{font-style:normal;font-size:34px}
.sv b{font:700 23px 'Barlow Condensed',sans-serif}
.sv span{font-size:12px;color:var(--mute)}
.sv em{margin-top:auto;font-style:normal;font-weight:800;font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(246,201,40,.28)}
.sv em.op{background:var(--turf);color:var(--onturf)}
.sv.main{grid-column:1/-1;min-height:150px;color:#fff;border-color:transparent;background:radial-gradient(70% 90% at 90% 0,rgba(246,201,40,.35),transparent 60%),linear-gradient(135deg,#2A8A64,#0F4A34)}
.sv.main span{color:#d8ecdc}
.sv.main em{background:var(--lamp);color:#1A1500}
.offer{margin:16px;padding:12px 16px;border-radius:16px;background:linear-gradient(90deg,#F6C928,#FFE58A);color:#1A1500;font-weight:800;text-align:center;box-shadow:0 6px 18px rgba(246,201,40,.35)}
input[type=number],select{width:100%;margin-top:6px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
.slot s{opacity:.6;font-size:11px}
.mi{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 16px;padding:14px 16px;border-radius:18px;background:var(--glass);border:1.5px solid var(--line);backdrop-filter:blur(3px)}
.mi b{display:block;font:700 23px 'Barlow Condensed',sans-serif}
.mi span{color:var(--mute);font-size:13px}
.mi em{font:700 23px 'Barlow Condensed',sans-serif;font-style:normal;color:var(--turf);white-space:nowrap}

.fx{position:absolute;inset:0}
.fx>div{position:absolute}
.offer.deal{background:linear-gradient(90deg,#2A8A64,#1F7553);color:#fff;box-shadow:0 6px 18px rgba(31,117,83,.35)}
.tot small{display:block;font:600 12px Manrope,system-ui,sans-serif;color:var(--lamp)}
.ots{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px}
.ots button{flex:none;padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--glass);font-weight:700}
.ots .on{background:var(--turf);border-color:var(--turf);color:var(--onturf)}
.act{display:flex;gap:8px;flex-wrap:wrap}
.tk .act button{margin-top:6px}
.ch{justify-self:start;font-style:normal;font-weight:800;font-size:12px;padding:4px 10px;border-radius:99px}
.ch.ok{background:var(--turf);color:var(--onturf)}
.ch.wait{background:rgba(246,201,40,.35)}
.ch.no{background:rgba(215,38,61,.18);color:var(--err)}
.bd2{display:grid;gap:6px;margin:10px 0;padding:12px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line)}
.bd2>div{display:flex;justify-content:space-between}
.bd2 .gr2{color:var(--turf);font-weight:700}
.bd2 .tt{font-weight:800;border-top:1.5px dashed var(--line);padding-top:6px}
.bd2 .ad{font-weight:800;color:var(--err)}
.pn{display:grid;gap:4px;justify-items:center;margin:8px 0;text-align:center}
.pn b{font:700 28px 'Barlow Condensed',sans-serif;letter-spacing:.05em}
.as{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
.card.empty p{margin:0 0 8px}
.brand{padding-right:50px}

.hd{font-size:13px;color:var(--err);font-weight:700}
.foot{text-align:center;color:var(--mute);font-size:13px;padding:18px 16px 0;margin:0}
.foot button{color:var(--turf);font-weight:700;text-decoration:underline;margin:0 10px}
.rd{padding:8px 12px;border-radius:10px;background:var(--lamp);color:#1A1500;font-weight:800}
.slot.sk{opacity:.55;animation:shim 1.2s ease-in-out infinite}
@keyframes shim{50%{opacity:.2}}
.offer.off{background:#FFE3E0;color:#7A1D14;box-shadow:none}
nav .ic{width:22px;height:22px;display:block}
.pinbox{margin:12px 0;padding:14px;border-radius:14px;border:1.5px dashed var(--turf);background:var(--bg)}
.pinbox p{margin:4px 0 8px}
.lnk{color:var(--turf);font-weight:700;text-decoration:underline}
.sv.main{min-height:150px}
.sv.main b{font-size:32px}
.sv.main em{justify-self:stretch;text-align:center;margin-top:14px;font-size:22px;padding:16px 20px;border-radius:16px;box-shadow:0 10px 26px rgba(246,201,40,.45);animation:cta 2.4s ease-in-out infinite}
@keyframes cta{50%{transform:scale(1.03)}}
.hero{padding-bottom:56px}
.hero h1{font-size:42px;max-width:none;margin-bottom:12px}
.cta{position:relative;z-index:1;display:block;width:100%;margin-top:18px;padding:20px 18px;border-radius:999px;border:1.5px solid rgba(255,255,255,.6);background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(228,243,234,.9));color:#0F4A34;font:800 24px/1 Manrope,system-ui,sans-serif;letter-spacing:.02em;text-align:center;box-shadow:0 10px 30px rgba(7,38,27,.28),0 0 0 6px rgba(255,255,255,.14);animation:breathe 4.5s ease-in-out infinite}
.offer.scarce{background:#FFF1D6;color:#7A4B00;box-shadow:none;border:1.5px solid #F6C928}
.foot.wa{display:block;text-align:center;color:var(--turf);font-weight:700;text-decoration:none}
@keyframes breathe{50%{box-shadow:0 14px 36px rgba(7,38,27,.3),0 0 0 13px rgba(255,255,255,.06)}}
.ok{color:var(--turf);font-weight:700}
.card.tk .rd{text-decoration:none;display:inline-block}
